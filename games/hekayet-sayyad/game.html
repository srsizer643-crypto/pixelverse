<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="hud">
    <span id="hMoney">💰 0ج</span>
    <span id="hBag">🧺 0/5</span>
    <span id="hCaught">🐟 0</span>
  </div>

  <div id="topBar">
    <button id="btnUpg" class="barbtn">⚙️ تطويرات</button>
    <button id="btnBag" class="barbtn">🧺 الشنطة</button>
    <button id="btnSell" class="barbtn sell">💰 بيع السمك</button>
  </div>

  <div id="hint">امشي لحد الصنارة عشان تصطاد</div>
  <div id="toast"></div>

  <div id="joyBase"><div id="joyKnob"></div></div>

  <div id="fishBtns">
    <button id="btnCast" class="bigbtn" disabled>ارمي<br>الصنارة</button>
    <button id="btnPull" class="bigbtn pull" style="display:none">اسحب!</button>
  </div>

  <div class="overlay" id="upgOverlay">
    <div class="panel">
      <h2>تطويرات الصياد</h2>
      <div id="shop"></div>
      <button class="panel-close" id="upgClose">قفل</button>
    </div>
  </div>

  <div class="overlay" id="bagOverlay">
    <div class="panel">
      <h2>شنطة السمك</h2>
      <div id="bagList"></div>
      <button class="panel-close" id="bagClose">قفل</button>
    </div>
  </div>
